<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photothèque SIG — Meknès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="masthead">
  <img class="logo" src="assets/logo-srm-fes-meknes.png" alt="Société Régionale Multiservices Fès-Meknès SA">
  <div class="title">
    <h1>Photothèque de l'éclairage public</h1>
    <p>Inventaire SIG — Ville de Meknès · armoires et points lumineux</p>
  </div>
  <img class="logo" src="assets/logo-cetener.png" alt="CETENER">
</header>

<nav class="navbar">
  <div class="seg" role="tablist" aria-label="Type d'élément">
    <button class="seg-btn active" data-type="armoires"><span class="dot arm"></span>Armoires <b id="cnt-armoires">–</b></button>
    <button class="seg-btn" data-type="pl"><span class="dot pl"></span>Points lumineux <b id="cnt-pl">–</b></button>
  </div>
  <div class="seg" aria-label="Affichage">
    <button class="seg-btn view active" data-view="list">☰ Liste</button>
    <button class="seg-btn view" data-view="map">◎ Carte</button>
  </div>
  <div class="spacer"></div>
  <button id="btn-settings" class="icon-btn" title="Paramètres" aria-label="Paramètres">⚙</button>
</nav>

<section class="toolbar">
  <div class="search"><input id="q" type="search" placeholder="Rechercher : FID, code, localisation, modèle…"></div>
  <select id="f-armoire"><option value="">Toutes les armoires</option></select>
  <label class="chk"><input type="checkbox" id="f-photos"> Avec photos</label>
  <div class="stats" id="summary"></div>
  <div class="spacer"></div>
  <button id="btn-links" class="btn">Liste des liens (.txt)</button>
  <button id="btn-zip" class="btn primary">⤓ Télécharger (ZIP)</button>
</section>

<main>
  <div id="list-view" class="pane">
    <table id="tbl"><thead></thead><tbody></tbody></table>
    <div id="pager" class="pager"></div>
  </div>
  <div id="map-view" class="pane hidden"><div id="map"></div></div>
  <div id="loading" class="loading"><div class="spinner"></div><span>Chargement de l'inventaire…</span></div>
</main>

<aside id="detail" class="drawer hidden" aria-live="polite">
  <div class="drawer-head">
    <div><div class="eyebrow" id="d-kind"></div><h2 id="d-title"></h2></div>
    <div class="drawer-actions">
      <button id="d-zip" class="btn primary small">⤓ ZIP</button>
      <button id="d-close" class="icon-btn" aria-label="Fermer">✕</button>
    </div>
  </div>
  <div id="d-body"></div>
</aside>

<div id="lightbox" class="lightbox hidden">
  <button class="lb-nav" id="lb-prev" aria-label="Précédente">‹</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="lb-nav" id="lb-next" aria-label="Suivante">›</button>
  <button class="lb-close" id="lb-close" aria-label="Fermer">✕</button>
</div>

<dialog id="batches" class="modal wide">
  <div class="modal-head">
    <div><h3>Téléchargement par lots</h3><p class="muted" id="b-info"></p></div>
    <button class="icon-btn" id="b-close" aria-label="Fermer">✕</button>
  </div>
  <p class="note" id="b-note"></p>
  <div id="b-list" class="batch-list"></div>
</dialog>

<dialog id="settings" class="modal">
  <form method="dialog">
    <div class="modal-head"><h3>Paramètres</h3></div>
    <label>URL des images
      <input id="s-base" placeholder="https://serveur/photos/{file}">
      <small><code>{file}</code> est remplacé par le nom de la photo ; sinon le nom est ajouté à la fin.</small>
    </label>
    <label>Téléchargements simultanés<input id="s-conc" type="number" min="1" max="16" value="6"></label>
    <details>
      <summary>Charger d'autres fichiers Excel</summary>
      <label>Armoires (.xlsx)<input type="file" id="s-file-arm" accept=".xlsx,.xls,.csv"></label>
      <label>Points lumineux (.xlsx)<input type="file" id="s-file-pl" accept=".xlsx,.xls,.csv"></label>
    </details>
    <menu><button value="ok" class="btn primary">Enregistrer</button></menu>
  </form>
</dialog>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
